<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Settings</title>

  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/settings.css">
</head>

<body>
  <div class="admin-wrapper">
    <div class="sidebar">
      <h2>GlobeTrek Admin</h2>

      <a href="dashboard.html">Dashboard</a>
      <a href="manage-staff.html">Manage Staff</a>
      <a href="manage-package.html">Manage Packages</a>
      <a href="admin-bookings.html">Bookings</a>
      <a href="reports.html">Reports</a>
      <a href="settings.html" class="active">Settings</a>
    </div>

    <div class="main">

      <h1>System Settings</h1>

      <!-- ACCOUNT SETTINGS -->
      <div class="section">

        <h2>Account Settings</h2>

        <label>Admin Name</label>
        <input type="text" id="adminName">

        <label>Email</label>
        <input type="email" id="adminEmail">

        <button onclick="saveAccount()">Save Account</button>

      </div>

      <!-- SYSTEM SETTINGS -->
      <div class="section">

        <h2>System Preferences</h2>

        <label>Enable Notifications</label>
        <select id="notifications">
          <option value="on">ON</option>
          <option value="off">OFF</option>
        </select>

        <label>Auto Confirm Bookings</label>
        <select id="autoConfirm">
          <option value="yes">YES</option>
          <option value="no">NO</option>
        </select>

        <button onclick="saveSystem()">Save Settings</button>

      </div>

      <!-- SECURITY -->
      <div class="section">

        <h2>Security</h2>

        <button class="danger" onclick="resetSystem()">Reset System</button>

        <p class="note">⚠ Admin-only action</p>

      </div>
    </div>
  </div>
  <!-- FOOTER  -->
  <footer class="admin-footer">
    <p>© 2026 GlobeTrek Admin Panel | Secure System</p>
  </footer>

  <script src="../js/settings.js"></script>

</body>

</html>
