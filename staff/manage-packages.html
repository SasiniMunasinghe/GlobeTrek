<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Manage Packages</title>
    <link rel="stylesheet" href="../css/staff-packages.css">
    

</head>

<body>

    <div class="sidebar">
        <h2>GlobeTrek Staff</h2>
        <a href="../staff/staff-dashboard.html">Dashboard</a>
        <a href="../staff/manage-packages.html">Manage Packages</a>
        <a href="../staff/manage-bookings.html">Manage Bookings</a>
        <a href="../staff/respond-queries.html">Customer Queries</a>
    </div>

    <div class="main">

        <h1>Manage Packages</h1>

        <div class="form-box">
            <h3>Add New Package</h3>

            <input type="text" id="pkgName" placeholder="Package Name">
            <input type="text" id="pkgPrice" placeholder="Price (e.g. 25000)">
            <input type="text" id="pkgDuration" placeholder="Duration">
            <input type="text" id="pkgDesc" placeholder="Description">

            <input type="file" id="pkgImage">

            <button onclick="addPackage()">Add Package</button>
        </div>

        <table id="packageTable">
            <tr>
                <th>Name</th>
                <th>Price</th>
                <th>Duration</th>
                <th>Description</th>
                <th>Image</th>
                <th>Action</th>
            </tr>
        </table>

    </div>

    <script src="../js/staff-packages.js"></script>
</body>

</html>
